<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas do Dia</title>
    <!-- Fonte Google para um visual mais moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Header da Tela -->
        <header class="header">
            <h1 class="blink-text">OFERTAS IMPERDÍVEIS</h1>
        </header>

        <!-- Container do Carrossel onde os produtos serão injetados -->
        <div id="carousel-container" class="carousel-container">
            <!-- Os produtos aparecerão aqui via JavaScript -->
        </div>

        <!-- Footer da Tela -->
        <footer class="footer">
            <p>Aproveite! Promoções válidas enquanto durarem os estoques.</p>
        </footer>
    </div>

    <!-- Template base para um item de produto (escondido) -->
    <template id="product-template">
        <div class="product-card">
            <div class="product-image-wrapper">
                <img src="" alt="Produto" class="product-image">
            </div>
            <div class="product-info">
                <h2 class="product-name">Nome do Produto</h2>
                <span class="validity-badge" style="display: none;"></span>
                <div class="prices">
                    <span class="old-price">R$ 0,00</span>
                    <span class="new-price">R$ 0,00</span>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
