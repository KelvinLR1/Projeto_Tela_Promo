<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Signage Supermercado</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/login.css">
</head>
<body>
    <div class="glass-card">
        <img src="/logo.png" alt="Logo" class="login-logo" style="height: 60px; width: auto; margin-bottom: 20px; object-fit: contain; display: inline-block;">
        <h1>Painel de Controle</h1>
        <p class="subtitle">Acesso restrito a administradores</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Digite o usuario" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Digite a senha" autocomplete="current-password">
            </div>

            <button type="submit" id="btnLogin">Entrar</button>
        </form>

        <a href="/" class="back-link">Voltar para a Tela Principal</a>
    </div>

    <div id="toast" class="toast">Credenciais incorretas.</div>

    <script src="/admin/login.js"></script>
</body>
</html>
