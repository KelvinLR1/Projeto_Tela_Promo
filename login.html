<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Signage Supermercado</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        /* GLASSMORPHISM CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }
        .glass-card:hover {
            border-color: rgba(251, 192, 45, 0.3);
            box-shadow: 0 20px 50px rgba(251, 192, 45, 0.05);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fbc02d, #ff9800, #f44336);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #b0bec5;
            margin-bottom: 35px;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b0bec5;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: #fbc02d;
            box-shadow: 0 0 15px rgba(251, 192, 45, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }
        button {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fbc02d, #ff9800);
            color: #090a0f;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.3);
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 192, 45, 0.5);
        }
        button:active {
            transform: translateY(1px);
        }
        /* NOTIFICATIONS TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            background: #c62828;
            border-left: 6px solid #ef5350;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(150px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Painel de Controle</h1>
        <p class="subtitle">Acesso restrito a administradores</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" required placeholder="Digite o usuário" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Digite a senha" autocomplete="current-password">
            </div>

            <button type="submit" id="btnLogin">Entrar</button>
        </form>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">Credenciais incorretas.</div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btnLogin.innerText = 'Autenticando...';
            btnLogin.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // Login bem sucedido, redireciona
                        window.location.href = '/config';
                        return;
                    }
                }

                // Se falhou
                showToast('Usuário ou senha incorretos.');
            } catch (err) {
                showToast('Erro ao tentar conectar com o servidor.');
            } finally {
                btnLogin.innerText = 'Entrar';
                btnLogin.disabled = false;
            }
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
